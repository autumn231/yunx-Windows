name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # jpackage 生成 MSI 需要 WiX 3.x（windows-latest 镜像自带；缺失时 choco 兜底安装）
      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1.8722 -y
            Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          }

      - name: Build MSI / EXE installers
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew packageReleaseMsi packageReleaseExe --no-daemon --stacktrace -PpackageVersion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew packageReleaseMsi packageReleaseExe --no-daemon --stacktrace
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: YunX-windows-installer
          path: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      # 打包失败时输出 jpackage 的具体错误（错误详情写在 runner 本地日志文件里）
      - name: Dump jpackage logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem build/compose/logs -Recurse -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content $_.FullName
          }
          Get-ChildItem build/compose/tmp -Filter *.args.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content $_.FullName
          }

      # 推送 v* 标签时自动创建 Release 并附带安装包
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
